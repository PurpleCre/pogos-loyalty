name: Code and database checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:postgres:pull
      - run: npm run test:postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-postgres-acceptance
          path: dist/postgres-acceptance/report.json
          retention-days: 7
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run privacy:pages
      - run: npm run native:preflight
      - run: npm run build:check
      - uses: actions/upload-artifact@v4
        with:
          name: offline-native-bundles
          path: |
            dist/android/
            dist/ios/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: privacy-page-previews
          path: dist/privacy-pages/
          retention-days: 7
