name: Code and database checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run edge:check
      - run: npm run test:edge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-edge-runtime-acceptance
          path: dist/edge-runtime/
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:postgres:pull
      - run: npm run test:postgres
      - run: npm run test:resilience
      - run: npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-postgres-acceptance
          path: |
            dist/postgres-acceptance/report.json
            dist/resilience-acceptance/report.json
            dist/performance-acceptance/
          retention-days: 7
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run health:demo
      - run: npm run monitoring:demo
      - run: npm run privacy:pages
      - run: npm run native:preflight
      - run: npm run build:check
      - run: npm run build:web:check
      - uses: actions/upload-artifact@v4
        with:
          name: offline-native-bundles
          path: |
            dist/android/
            dist/ios/
            dist/web/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-operational-health
          path: |
            dist/operational-health/
            dist/monitoring-cycle/
            dist/integrity-health/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: privacy-page-previews
          path: dist/privacy-pages/
          retention-days: 7
