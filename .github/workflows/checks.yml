name: Code and database checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run native:preflight
      - run: npm run build:check
      - uses: actions/upload-artifact@v4
        with:
          name: offline-native-bundles
          path: dist/
          retention-days: 7
